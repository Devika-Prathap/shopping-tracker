<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CartLens - Automated Shopping & Expense Tracker</title>
    <meta name="description" content="Zero-effort shopping tracker that automatically syncs bank payments, extracts digital receipts, and categorizes purchases across clothes, tops, shoes, electronics, and accessories with real-time cost calculation." />
    <meta property="og:title" content="CartLens - Automated Shopping & Expense Tracker" />
    <meta property="og:description" content="Zero-effort shopping tracker that automatically syncs bank payments, extracts digital receipts, and categorizes purchases across clothes, tops, shoes, electronics, and accessories with real-time cost calculation." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('shopping_theme');
          var isDark = saved === 'dark' || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.setAttribute('data-theme', 'dark');
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.setAttribute('data-theme', 'light');
          }
          var palette = localStorage.getItem('cartlens_light_palette') || 'warm-ivory';
          document.documentElement.setAttribute('data-palette', palette);
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[#FFF9F2] text-[#1E1B2E] dark:bg-[#0B0F19] dark:text-[#F8FAFC] antialiased font-sans selection:bg-purple-500/20 selection:text-purple-600 min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
